[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigation = "2.8.4"
coroutines = "1.8.1"
serialization = "1.7.3"
ktor = "2.3.12"
datastore = "1.1.1"
junit = "4.13.2"
# Pleos
pleosVehicle = "2.3.2"

[libraries]
androidx-core-ktx          = { group = "androidx.core",               name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-compose = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }
androidx-lifecycle-vm      = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
androidx-activity-compose  = { group = "androidx.activity",           name = "activity-compose",               version.ref = "activityCompose" }
androidx-navigation-compose= { group = "androidx.navigation",         name = "navigation-compose",             version.ref = "navigation" }
androidx-datastore-prefs   = { group = "androidx.datastore",          name = "datastore-preferences",          version.ref = "datastore" }

compose-bom                = { group = "androidx.compose",            name = "compose-bom",                    version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-graphics        = { group = "androidx.compose.ui",         name = "ui-graphics" }
compose-ui-tooling         = { group = "androidx.compose.ui",         name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
compose-material3          = { group = "androidx.compose.material3",  name = "material3" }
compose-material-icons     = { group = "androidx.compose.material",   name = "material-icons-extended" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",     version.ref = "serialization" }

ktor-client-okhttp         = { group = "io.ktor",                     name = "ktor-client-okhttp",             version.ref = "ktor" }
ktor-client-content-neg    = { group = "io.ktor",                     name = "ktor-client-content-negotiation",version.ref = "ktor" }
ktor-serialization-json    = { group = "io.ktor",                     name = "ktor-serialization-kotlinx-json",version.ref = "ktor" }

pleos-vehicle              = { group = "ai.pleos.playground",         name = "Vehicle",                        version.ref = "pleosVehicle" }

junit                      = { group = "junit",                       name = "junit",                          version.ref = "junit" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",        version.ref = "coroutines" }

[plugins]
android-application  = { id = "com.android.application",                  version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",             version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",version.ref = "kotlin" }
